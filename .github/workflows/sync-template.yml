name: template 브랜치 동기화

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: template 브랜치 동기화 (docs 제외)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 원격 template 브랜치 가져오기
          git fetch origin template || true

          # template 브랜치로 전환 (없으면 생성)
          git checkout -B template origin/template 2>/dev/null || git checkout -b template

          # master 내용을 template에 덮어쓰기
          git checkout master -- .

          # docs, .github 폴더 제거
          git rm -r --cached docs/ --ignore-unmatch
          git rm -r --cached .github/ --ignore-unmatch

          # 변경사항이 있을 때만 커밋
          git diff --cached --quiet || git commit -m "master 동기화 (docs 제외)"

          git push origin template
